<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>BJJ Journal</title>
    <base href="/" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="BJJ Journal" />
    <link rel="preload" id="webassembly" />
    <link rel="preload" href="fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script src="js/bjj.js"></script>
    <script type="importmap"></script>
</head>
<body>
    <div id="app">
        <div class="boot"><img src="icon.svg" alt="Cargando BJJ Journal" /></div>
    </div>
    <div id="blazor-error-ui">
        Ha ocurrido un error inesperado.
        <a href="" class="reload">Recargar</a>
        <span class="dismiss">✕</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            // Si había una versión anterior instalada, recarga una vez cuando entra la nueva.
            const hadController = !!navigator.serviceWorker.controller;
            let reloaded = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (hadController && !reloaded) { reloaded = true; location.reload(); }
            });
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).catch(() => {});
        }
    </script>
</body>
</html>
